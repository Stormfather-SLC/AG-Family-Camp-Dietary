<style>
/* Layout: follows the Aspen Grove site and the Conference Details form. Navy header band, light grey page, white cards, royal-blue actions, IBM Plex Sans. One column for organizers; tabbed workspace for staff. */
:root{
  --bg:#f6f6f8; --surface:#ffffff; --sunk:#eef2f7; --line:#e1e5eb;
  --fg:#141414; --muted:#5f6670;
  --navy:#002e5d; --navy-ink:#ffffff; --title:#002e5d;
  --accent:#0047ba; --accent-ink:#ffffff; --accent-soft:#e7f1fe;
  --ok:#1f7a45; --ok-soft:#dff1e6; --warn:#9a5a00; --warn-soft:#fdf0d9; --bad:#c41230; --bad-soft:#fde4e7;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --sunk:#1e2733; --line:#2c3644;
  --fg:#eef1f5; --muted:#a3adba; --navy:#0b2340; --navy-ink:#ffffff; --title:#cfe2ff;
  --accent:#6aa6ff; --accent-ink:#06142b; --accent-soft:#16294a;
  --ok:#6fd39a; --ok-soft:#173526; --warn:#f0b45a; --warn-soft:#3a2a12; --bad:#ff8094; --bad-soft:#3d1820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --sunk:#1e2733; --line:#2c3644;
  --fg:#eef1f5; --muted:#a3adba; --navy:#0b2340; --navy-ink:#ffffff; --title:#cfe2ff;
  --accent:#6aa6ff; --accent-ink:#06142b; --accent-soft:#16294a;
  --ok:#6fd39a; --ok-soft:#173526; --warn:#f0b45a; --warn-soft:#3a2a12; --bad:#ff8094; --bad-soft:#3d1820; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--navy);color:var(--navy-ink)}
header.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:0}
.brand b{font-size:18px;font-weight:600;letter-spacing:.01em;user-select:none}
.brand span{font-size:13px;opacity:.8}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--navy-ink);padding:6px 12px;border-radius:999px;font:500 13px var(--body);cursor:pointer}
.tabs button[aria-pressed="true"]{background:#fff;color:#002e5d;border-color:#fff}
.banner{font-size:13px;padding-block:8px;background:var(--warn-soft);color:var(--warn)}
main.wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{color:var(--title);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:24px;font-weight:600}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;min-width:0}
input[type=text],input[type=email],input[type=date],input[type=search],select,textarea{font:15px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:500 14px var(--body);border-radius:6px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mute{background:var(--sunk);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:0;font-weight:500}
dl{margin:0}
.note{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:14px}
.note.callout{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 6px 6px 0;color:var(--fg)}
.note.callout b{color:var(--title)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.fam{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fam-h{background:var(--sunk);padding:6px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between}
.guest{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.guest:first-of-type{border-top:0}
.guest .who{display:flex;flex-direction:column;gap:4px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--fg)}
.chip.serious{background:var(--bad-soft);color:var(--bad);font-weight:600}
.empty{padding:22px;text-align:center;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(0,10,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:20}
.dialog{background:var(--surface);color:var(--fg);border-radius:10px;max-width:560px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:4px 12px}
.picks label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:400}
.picks .h{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px}
.lv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 10px;align-items:center;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.save{font-size:13px;color:var(--muted)}
.code{font-family:var(--mono);font-size:13px}
pre.mail{white-space:pre-wrap;font:13px/1.5 var(--body);background:var(--sunk);padding:12px;border-radius:6px;margin:0;max-height:260px;overflow:auto}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav b{min-width:220px}
/* printout preview */
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:22px;font-size:13px;overflow-x:auto}
.sheet h2,.sheet h3{color:#002e5d}
.sheet table th{color:#555}
.sheet td,.sheet th{border-color:#ddd}
.sheet .flag{color:#c41230;font-weight:700}
.sheet .sec{margin-top:18px}
.sheet .gh{background:#eef2f7;padding:6px 8px;font-weight:600;margin-top:12px}
.sheet .fh{font-weight:600;font-size:12px;color:#555;padding:6px 8px 2px;text-transform:uppercase;letter-spacing:.04em}
.sheet .tot{font-size:22px;font-weight:700;color:#002e5d}
/* kitchen sheets (daily production list, weekly meal schedule) */
.sheet .dpage{break-after:page;padding-bottom:18px}
.sheet .dpage:last-child{break-after:auto}
.sheet .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #002e5d;padding-bottom:8px;margin-bottom:10px}
.sheet .top .org{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#555}
.sheet .top h1{font-size:22px;color:#002e5d;margin:2px 0}
.sheet .stamp{font-size:12px;font-weight:600;color:#1f7a45;text-align:right}
.sheet .stamp.draft{color:#9a5a00}
.sheet .stamp span{display:block;font-weight:400;color:#555}
.sheet .dsvc{margin-top:14px;break-inside:avoid}
.sheet .dsvc h2{font-size:16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #ccc;padding-bottom:3px}
.sheet .dtot{font-size:13px;font-weight:600;color:#555}
.sheet .ptab td.cb{width:26px}
.sheet .ptab td.pc,.sheet .ptab th.pc{width:110px}
.sheet .box{display:inline-block;width:14px;height:14px;border:1.5px solid #555;border-radius:2px;vertical-align:middle}
.sheet .par{display:inline-block;width:90px;border-bottom:1px solid #555;height:16px}
.sheet .miss{color:#9a5a00}
.sheet .k-spec td{background:#f6f8fb}
.sheet .pnotes{margin-top:18px;border:1px solid #ccc;border-radius:4px;min-height:80px;padding:6px 8px;font-size:12px;color:#555}
.sheet .pendnote{background:#fdf0d9;color:#9a5a00;padding:6px 10px;border-radius:4px;margin:8px 0;font-size:12px}
@media print{
  body[data-view="kitchen"] header.band,body[data-view="week"] header.band,body[data-view="printout"] header.band,
  body[data-view="kitchen"] .banner,body[data-view="week"] .banner,body[data-view="printout"] .banner,
  body[data-view="kitchen"] main>.card,body[data-view="week"] main>.card,body[data-view="printout"] main>.card,.toast{display:none!important}
  body[data-view="kitchen"],body[data-view="week"],body[data-view="printout"]{background:#fff}
  body[data-view="kitchen"] main.wrap,body[data-view="week"] main.wrap,body[data-view="printout"] main.wrap{padding:0;max-width:none}
  body[data-view="kitchen"] .sheet,body[data-view="week"] .sheet,body[data-view="printout"] .sheet{border:0;padding:0}
}
@media (max-width:560px){.lv{grid-template-columns:1fr}.weeknav b{min-width:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="band"><div class="wrap">
  <div class="brand"><b id="brandName">Aspen Grove</b><span>Family Camp dietary needs &amp; preferences</span></div>
  <nav class="tabs" id="tabs" hidden></nav>
</div></header>
<div class="banner" id="banner" hidden><div class="wrap" id="bannerText"></div></div>
<main class="wrap" id="app"><div class="card"><p class="muted">Loading…</p></div></main>

<script>
// ---------- setup ----------
const DEMO=/[?&]demo(=|&|$)/.test(location.search)||/\.github\.io$/.test(location.hostname);
const PAGE_URL=DEMO?"":"https://claude.ai/artifact/1AMXwYNZtpJiycYB2Gz1iz"; // invitation links point here
const OFFICE_PHONE="";        // shown to organizers when filled in
const LS_KEY="fcdiet:groups:v3", STAFF_KEY="fcdiet:staff";
const ALLERGENS=["Milk / dairy","Eggs","Wheat / gluten","Peanuts","Tree nuts","Fish","Shellfish","Soy","Sesame"];
const CONDITIONS=["Celiac disease"];   // always strict, no seriousness question
const DIETS=["Vegetarian","Vegan","Halal","Kosher"];
const ABBR={"Milk / dairy":"DF","Eggs":"EF","Wheat / gluten":"GF","Peanuts":"PN","Tree nuts":"TN","Fish":"FISH","Shellfish":"SHELL","Soy":"SOY","Sesame":"SES","Celiac disease":"CEL","Vegetarian":"VEG","Vegan":"VGN","Halal":"HAL","Kosher":"KOS"};
const LEVELS=[["intol","Intolerance"],["mild","Allergy, mild"],["severe","Allergy, severe"],["air","Allergy, airborne / anaphylactic"],["pref","Preference"]];
const LEVEL_TEXT={intol:"intolerance",mild:"mild allergy",severe:"severe allergy",air:"airborne allergy",pref:"preference"};
const isSerious=it=>it.r==="Celiac disease"||it.level==="severe"||it.level==="air";

// ---------- small helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const fmt=(s,opt={weekday:"short",month:"short",day:"numeric"})=>s?parse(s).toLocaleDateString(undefined,opt):"";
const fmtRange=(a,b)=>a===b?fmt(a):fmt(a)+" – "+fmt(b);
// Camp weeks run Saturday check-in through Friday.
const campWeekOf=s=>{const d=parse(s);const k=(d.getDay()+1)%7;d.setDate(d.getDate()-k);return iso(d)};
const weekEnd=sat=>addDays(sat,6);
const weekLabel=sat=>fmt(sat,{month:"short",day:"numeric"})+" – "+fmt(weekEnd(sat),{month:"short",day:"numeric"});
// Saturday check-ins, May through September, for this summer (weeks not yet over) and next summer.
function campSeasons(){const y=new Date().getFullYear(),now=today(),out=[];
  for(const yr of [y,y+1]){let d=campWeekOf(yr+"-05-07");const weeks=[];
    while(d<=yr+"-09-30"){if(d.slice(5,7)>="05"&&weekEnd(d)>=now)weeks.push(d);d=addDays(d,7)}
    if(weeks.length)out.push([yr,weeks])}
  return out}
const uid=()=>Math.random().toString(36).slice(2,10);
function newCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="FC-";for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function lsGet(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let toastT;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
async function copyText(txt,label){try{await navigator.clipboard.writeText(txt);toast((label||"Text")+" copied")}catch(e){showText(label||"Copy this text",txt)}}
function itemLabel(it){const n=it.r==="Other"?(it.text||"Other"):it.r;const lv=it.r==="Celiac disease"?"strict":(it.level?LEVEL_TEXT[it.level]:"");return lv?n+" ("+lv+")":n}
function itemShort(it){return it.r==="Other"?"OTHER":ABBR[it.r]}

// ---------- data store: shared database inside Claude, this browser otherwise ----------
// Records from the shared database are read-only; always work on a copy.
const copy=o=>JSON.parse(JSON.stringify(o));
const store={db:null,mode:"local",subs:[],
  async init(){
    try{if(!DEMO&&window.claude&&claude.use){this.db=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),10000))])}}catch(e){this.db=null}
    this.mode=this.db?"db":"local";
    if(this.mode==="local"&&!lsGet(LS_KEY,null))lsSet(LS_KEY,sampleGroups());
  },
  local(){return lsGet(LS_KEY,{})},
  async all(){if(this.db){const q=await this.db.collection("groups").get();return q.docs.map(d=>copy(d.data()))}return Object.values(this.local())},
  async get(code){if(this.db){const s=await this.db.doc("groups/"+code).get();return s.exists?copy(s.data()):null}return this.local()[code]||null},
  async put(g){g=JSON.parse(JSON.stringify(g));if(this.db){await this.db.doc("groups/"+g.code).set(g);return}const all=this.local();all[g.code]=g;lsSet(LS_KEY,all);this.ping()},
  async del(code){if(this.db){await this.db.doc("groups/"+code).delete();return}const all=this.local();delete all[code];lsSet(LS_KEY,all);this.ping()},
  watch(cb){if(this.db){return this.db.collection("groups").onSnapshot(q=>cb(q.docs.map(d=>copy(d.data()))),()=>cb(null))}this.subs.push(cb);cb(Object.values(this.local()));return()=>{this.subs=this.subs.filter(x=>x!==cb)}},
  ping(){const v=Object.values(this.local());this.subs.forEach(f=>f(v))}
};
// Retention: dietary details are kept only through the group's week. The day after a group leaves, its record is deleted.
const expired=g=>g.depart&&g.depart<today();
async function purgeExpired(list){let n=0;for(const g of list||[]){if(expired(g)){try{await store.del(g.code);n++}catch(e){}}}return n}

// ---------- sample groups (made up; dates move with today) ----------
function sampleGroups(){
  // Two camp weeks in July of the next summer season (Family Camp runs May to September).
  const yr=today()>new Date().getFullYear()+"-07-01"?new Date().getFullYear()+1:new Date().getFullYear();
  const mon=campWeekOf(yr+"-07-16"), fri=weekEnd(mon), mon2=addDays(mon,7);
  const G=(o)=>Object.assign({guests:[],status:"open",noneNeeded:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),touched:true,sample:true},o);
  const P=(name,family,items)=>({id:uid(),name,family,items});
  const gs=[
    G({code:"FC-DEMO1",name:"Larsen Family Reunion",organizer:"Karen Larsen",email:"karen.larsen@example.com",arrive:mon,depart:fri,deadline:addDays(mon,-14),status:"locked",lockedAt:new Date().toISOString(),
      guests:[P("Ethan Larsen","Larsen (Ethan & Amy)",[{r:"Wheat / gluten",level:"intol"},{r:"Milk / dairy",level:"intol"}]),P("Amy Larsen","Larsen (Ethan & Amy)",[{r:"Milk / dairy",level:"intol"}]),
        P("Lily Larsen","Larsen (Ethan & Amy)",[{r:"Peanuts",level:"air"},{r:"Tree nuts",level:"severe"}]),P("Grandpa Dale Larsen","Larsen (Dale & Ruth)",[{r:"Celiac disease"}]),
        P("Ruth Larsen","Larsen (Dale & Ruth)",[{r:"Vegetarian",level:"pref"}]),P("Marcus Okafor","Okafor",[{r:"Shellfish",level:"severe"}]),P("Ada Okafor","Okafor",[{r:"Wheat / gluten",level:"intol"}])]}),
    G({code:"FC-DEMO2",name:"Pine Ridge Ward Family Camp",organizer:"Daniel Whitaker",email:"d.whitaker@example.com",arrive:mon,depart:fri,deadline:addDays(mon,-14),status:"locked",lockedAt:new Date().toISOString(),
      guests:[P("Sofia Ramirez","Ramirez",[{r:"Wheat / gluten",level:"intol"}]),P("Mateo Ramirez","Ramirez",[{r:"Eggs",level:"mild"}]),P("Hannah Brooks","Brooks",[{r:"Vegan",level:"pref"}]),
        P("Owen Brooks","Brooks",[{r:"Milk / dairy",level:"intol"},{r:"Other",text:"Strawberries",level:"mild"}]),P("Grace Chen","Chen",[{r:"Sesame",level:"severe"}])]}),
    G({code:"FC-DEMO3",name:"Hollis–Day Family",organizer:"Megan Hollis",email:"megan.hollis@example.com",arrive:mon2,depart:weekEnd(mon2),deadline:addDays(mon2,-14),status:"open",
      guests:[P("Jacob Hollis","Hollis",[{r:"Wheat / gluten",level:"intol"}]),P("Noah Day","Day",[{r:"Milk / dairy",level:"intol"}])]}),
    G({code:"FC-DEMO4",name:"Thompson Cousins Camp",organizer:"Rachel Thompson",email:"rachel.t@example.com",arrive:mon2,depart:weekEnd(mon2),deadline:addDays(mon2,-14),status:"open",touched:false,guests:[]})
  ];
  return Object.fromEntries(gs.map(g=>[g.code,g]));
}

// ---------- status ----------
function statusOf(g){
  if(g.status==="locked")return["Locked in","p-ok"];
  if(g.deadline&&today()>g.deadline)return["Past deadline","p-bad"];
  if(!g.touched)return["Not started","p-mute"];
  return["In progress","p-warn"];
}
const linkFor=code=>(PAGE_URL||location.href.split("#")[0])+"#"+code;
function inviteText(g){
  return {subject:`Dietary needs and preferences for your Aspen Grove stay (${g.name})`,
  body:`Hi ${(g.organizer||"").split(" ")[0]||"there"},

We're looking forward to hosting ${g.name} at Aspen Grove, ${fmtRange(g.arrive,g.depart)}.

So our kitchen can plan for everyone, please list anyone in your group with a food allergy, intolerance, or dietary restriction, and anyone with a dietary preference such as vegetarian, vegan, halal, or kosher, on this page:

${linkFor(g.code)}

If the link doesn't open your group, enter this code on the page: ${g.code}

Please finish and lock in your list by ${fmt(g.deadline,{weekday:"long",month:"long",day:"numeric"})}. If no one in your group has dietary needs or preferences, you can say so on the page.

We only use this information to prepare meals, and we delete it at the end of your stay.

Thank you,
Aspen Grove`}}
function reminderText(g){
  const n=(g.guests||[]).length;
  return {subject:`Reminder: dietary needs and preferences for ${g.name}`,
  body:`Hi ${(g.organizer||"").split(" ")[0]||"there"},

function groupByFamily(list){const o={};for(const p of list){const f=(p.family||"").trim()||"Other guests";(o[f]=o[f]||[]).push(p)}return o}

function queueSave(){
  if(!current||current.missing)return;
  current.touched=true;current.updatedAt=new Date().toISOString();
  saveState="Saving…";const s=$("#saveState");if(s)s.textContent=saveState;

    saving=saving.then(()=>store.put(snap)).then(()=>{saveState="All changes saved";const s=$("#saveState");if(s)s.textContent=saveState},

// add / edit a person
function personDialog(p){
  const editing=!!p;p=p?JSON.parse(JSON.stringify(p)):{id:uid(),name:"",family:"",items:[]};
  let newFam=false; // true while the organizer is naming a new family or household
  const fams=[...new Set((current.guests||[]).map(x=>(x.family||"").trim()).filter(Boolean))];
  const ov=document.createElement("div");ov.className="overlay";
  const pick=r=>p.items.find(i=>i.r===r);
  // "Not listed above": one always-visible box; comma-separated entries become separate items, each with its own seriousness.
  const otherLv={};p.items.filter(i=>i.r==="Other").forEach(i=>{otherLv[(i.text||"").trim().toLowerCase()]=i.level||""});
  let otherText=p.items.filter(i=>i.r==="Other").map(i=>(i.text||"").trim()).filter(Boolean).join(", ");
  p.items=p.items.filter(i=>i.r!=="Other");
  const others=()=>{const seen=new Set();return otherText.split(/[,;\n]/).map(s=>s.trim()).filter(s=>{const k=s.toLowerCase();if(!s||seen.has(k))return false;seen.add(k);return true}).map(text=>({r:"Other",text,level:otherLv[text.toLowerCase()]||""}))};
  const lvOpts=(i)=>`<option value="">Not sure</option>${LEVELS.filter(([v])=>DIETS.includes(i.r)?v==="pref":true).map(([v,l])=>`<option value="${v}" ${i.level===v?"selected":""}>${l}</option>`).join("")}`;
  const lvHTML=()=>{const std=p.items.filter(i=>i.r!=="Celiac disease"), oth=others();if(!std.length&&!oth.length)return "";
    return `<div class="f"><span style="font-size:13px;font-weight:500">How serious is each? <span class="muted" style="font-weight:400">Leave as "Not sure" if you don't know.</span></span>
        <div class="lv">${std.map(i=>`<span>${esc(i.r)}</span><select data-lv="${esc(i.r)}" aria-label="How serious: ${esc(i.r)}">${lvOpts(i)}</select>`).join("")}${oth.map(i=>`<span>${esc(i.text)}</span><select data-olv="${esc(i.text.toLowerCase())}" aria-label="How serious: ${esc(i.text)}">${lvOpts(i)}</select>`).join("")}</div></div>`};
  const draw=()=>{
    ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pd-h">
      <h2 id="pd-h">${editing?"Edit":"Add a person"}</h2>
      <div class="grid2">
        <label class="f">Name<input type="text" id="pd-name" value="${esc(p.name)}" autocomplete="off"></label>
        <label class="f"><span>Family or Household <span class="muted" style="font-weight:400">(Optional)</span></span><select id="pd-famsel"><option value="" ${!newFam&&!p.family?"selected":""}>None</option>${fams.map(f=>`<option value="${esc(f)}" ${!newFam&&p.family===f?"selected":""}>${esc(f)}</option>`).join("")}<option value="__new" ${newFam?"selected":""}>+ New family or household…</option></select></label>
        ${newFam?`<label class="f" style="grid-column:1/-1">Name of the family or household<input type="text" id="pd-fam" value="${esc(p.family)}" placeholder="e.g. Larsen (Ethan & Amy)" autocomplete="off"><span class="muted" style="font-weight:400">You can pick it for the next person you add.</span></label>`:""}
      </div>
      <fieldset style="border:0;padding:0;margin:0"><legend style="font-size:13px;font-weight:500;margin-bottom:4px">Dietary needs and preferences</legend>
        <div class="picks">
          <div class="h">Allergies and intolerances</div>${ALLERGENS.map(r=>ck(r)).join("")}
          <div class="h">Medical conditions</div>${CONDITIONS.map(r=>ck(r)).join("")}
          <div class="h">Diets and preferences</div>${DIETS.map(r=>ck(r)).join("")}
          <div class="h" id="pd-other-h">Not listed above</div>
          <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:4px"><input type="text" id="pd-other" aria-labelledby="pd-other-h" value="${esc(otherText)}" placeholder="e.g. strawberries, pescatarian, no pork" autocomplete="off"><span class="small muted">Separate items with commas.</span></div>
        </div></fieldset>
      <div id="pd-lvbox">${lvHTML()}</div>
      ${p.items.some(i=>i.r==="Celiac disease")?`<p class="small muted">Celiac disease is always treated as strictly gluten-free.</p>`:""}
      <p class="small" id="pd-err" role="alert" style="color:var(--bad);font-weight:500"></p>
      <div class="row" style="justify-content:flex-end"><button class="btn quiet" id="pd-cancel" type="button">Cancel</button><button class="btn" id="pd-ok" type="button">${editing?"Save":"Add"}</button></div>
    </div>`;
    function ck(r,l){return `<label><input type="checkbox" data-pick="${esc(r)}" ${pick(r)?"checked":""}> ${esc(l||r)}</label>`}
  };
  const read=()=>{const n=ov.querySelector("#pd-name");if(n)p.name=n.value;
    const fs=ov.querySelector("#pd-famsel");if(fs){newFam=fs.value==="__new";if(newFam){const f=ov.querySelector("#pd-fam");p.family=f?f.value:""}else p.family=fs.value}readLv();const o=ov.querySelector("#pd-other");if(o)otherText=o.value};
  const readLv=()=>{ov.querySelectorAll("[data-lv]").forEach(s=>{const it=pick(s.dataset.lv);if(it)it.level=s.value});
    ov.querySelectorAll("[data-olv]").forEach(s=>{otherLv[s.dataset.olv]=s.value})};
  ov.addEventListener("input",e=>{if(e.target.id!=="pd-other")return;readLv();otherText=e.target.value;ov.querySelector("#pd-lvbox").innerHTML=lvHTML()});
  draw();document.body.appendChild(ov);ov.querySelector("#pd-name").focus();
  ov.addEventListener("change",e=>{
    if(e.target.id==="pd-famsel"){read();draw();const f=ov.querySelector(newFam?"#pd-fam":"#pd-famsel");if(f)f.focus();return}
    const c=e.target.closest("[data-pick]");if(!c)return;read();const r=c.dataset.pick;
    if(c.checked){if(!pick(r))p.items.push(DIETS.includes(r)?{r,level:"pref"}:{r,level:""})}else p.items=p.items.filter(i=>i.r!==r);
    draw();const again=ov.querySelector(`[data-pick="${CSS.escape(r)}"]`);if(again)again.focus()});
  const close=()=>{ov.remove();document.removeEventListener("keydown",onKey)};
  const onKey=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",onKey);
  ov.addEventListener("click",e=>{
    if(e.target===ov||e.target.id==="pd-cancel")return close();
    if(e.target.id!=="pd-ok")return;read();
    p.name=p.name.trim();p.family=p.family.trim();const err=ov.querySelector("#pd-err");
    if(!p.name){err.textContent="Enter the person's name.";return}
    if(newFam&&!p.family){err.textContent="Name the new family or household, or choose None.";return}
    if(!p.items.length&&!others().length){err.textContent="Choose at least one dietary need or preference, or type one under Not listed above.";return}
    const dup=current.guests.find(x=>x.id!==p.id&&x.name.trim().toLowerCase()===p.name.toLowerCase());
    if(dup&&!ov.dataset.dupOk){err.textContent=`${dup.name} is already listed. Press ${editing?"Save":"Add"} again to list them twice, or Cancel and edit the existing entry.`;ov.dataset.dupOk="1";return}
    p.items=[...p.items,...others()];
    const i=current.guests.findIndex(x=>x.id===p.id);if(i>=0)current.guests[i]=p;else current.guests.push(p);
    current.noneNeeded=false;close();queueSave();renderOrg();toast(editing?"Saved":`${p.name} added`);
  });
}
function confirmDialog(title,text,okLabel,onOk,danger){

  ov.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cd-h"><h2 id="cd-h">${esc(title)}</h2><p>${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn quiet" id="cd-no" type="button">Cancel</button><button class="btn ${danger?"danger":""}" id="cd-ok" type="button">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(ov);ov.querySelector("#cd-ok").focus();
  const close=()=>ov.remove();
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.id==="cd-no")close();if(e.target.id==="cd-ok"){close();onOk()}});

function showText(title,txt,extra){

}

        <td><div class="row"><button class="btn sm quiet" data-act="open" data-code="${g.code}">Open</button><button class="btn sm quiet" data-act="invite" data-code="${g.code}">Invitation</button>${g.status!=="locked"?`<button class="btn sm quiet" data-act="remind" data-code="${g.code}">Reminder</button>`:""}<button class="btn sm quiet" data-act="delete" data-code="${g.code}">Delete</button></div></td></tr>`}).join("")}</tbody></table></div>${list.some(g=>g.sample)?`<div class="row between"><span class="small muted">Groups with codes starting FC-DEMO are made-up samples.</span><button class="btn sm ghost" data-act="samples">Reset sample groups</button></div>`:""}`

const weekIsOdd=mon=>Math.round((parse(mon)-parse(WEEK1))/(7*864e5))%2===0;   // Week 1 = WEEK1, Week 2 = the next Saturday, ...

// One meal: items (with check box and PAR line for the production list) and special plates.

// Weekly meal schedule: one summary page, then one page per day.
function weekKitchenBody(mon){
  const dates=[...Array(7)].map((_,i)=>addDays(mon,i)).filter(d=>onSite(d).length);
  if(!dates.length)return `<p>No groups on site this week.</p>`;

  const glance=dates.map(d=>{const g=onSite(d),n=peopleOn(d).length;
    return `<tr><th scope="row">${esc(fmt(d,{weekday:"short",month:"short",day:"numeric"}))}</th><td>${g.map(x=>esc(x.name)+(x.status!=="locked"?` <span class="miss">(draft)</span>`:"")).join("<br>")}</td><td class="num">${n||"–"}</td><td>${mealsOn(d).map(m=>esc(m.label)+(m.time?" "+esc(fmtSpan(m)):"")).join(", ")||`<span class="muted">No food service</span>`}</td></tr>`}).join("");
  const diet=gl.map(g=>{const ps=(g.guests||[]).filter(p=>p.items&&p.items.length);
    return `<tr class="dg"><th colspan="3" class="gh" style="text-transform:none;letter-spacing:0;font-size:13px;color:#111">${esc(g.name)} · ${esc(fmtRange(g.arrive,g.depart))}${g.status!=="locked"?` <span class="miss">(draft)</span>`:""}</th></tr>`
      +(ps.length?ps.map(p=>`<tr><td style="width:30%"><b>${esc(p.name)}</b></td><td>${platesHTML(p)}</td><td style="width:18%" class="small">${esc(p.items.map(itemShort).join(" + "))}</td></tr>`).join(""):`<tr><td colspan="3" class="muted">${g.noneNeeded?"No dietary needs or preferences.":"Nothing listed yet."}</td></tr>`)}).join("");
  const summary=`<div class="dpage"><div class="top"><div><div class="org">Aspen Grove · Family Camp weekly meal schedule</div><h1>Camp week ${esc(weekLabel(mon))}, ${parse(mon).getFullYear()}</h1><div>${gl.length} group${gl.length===1?"":"s"} on site</div></div>${stampHTML(gl)}</div>
    ${pendHTML(mon)}
    <h3>At a glance</h3><table><thead><tr><th style="width:110px">Day</th><th>Groups on site</th><th class="num" style="width:90px">Special plates</th><th>Meals</th></tr></thead><tbody>${glance}</tbody></table>
    <p class="small" style="color:#555;margin-top:6px">Each day follows on its own page.</p>
    <div class="sec"><h3>Dietary accommodations</h3><table><tbody>${diet}</tbody></table></div>
    <p style="color:#777;font-size:11px;margin-top:14px">Codes: ${Object.entries(ABBR).map(([k,v])=>v+" = "+k).join(" · ")} · OTHER = see note. Red = serious allergy or celiac. Confidential: dispose of this sheet at the end of the week.</p></div>`;
  const days=dates.map(d=>{const gs=onSite(d),people=peopleOn(d);
    return `<div class="dpage"><div class="top"><div><div class="org">Aspen Grove · Family Camp meal schedule</div><h1>${esc(fmt(d,{weekday:"long",month:"long",day:"numeric",year:"numeric"}))}</h1><div>${groupsLine(gs,d)}</div></div></div>
      ${mealsOn(d).map(m=>mealBlock(m,people,false)).join("")||`<p style="color:#555">No meals are set for this day.</p>`}</div>`}).join("");
  return summary+days;
}

// Page controls for both kitchen views.
let kitchenDate="", kitchenWeek="";
function kitchenWeeks(){return [...new Set(siteDates().map(campWeekOf))].sort()}
function renderKitchen(){
  const app=$("#app");
  if(allGroups==null){app.innerHTML=`<div class="card"><p class="muted">Loading…</p></div>`;return}
  const dates=siteDates();
  if(!dates.length){app.innerHTML=`<section class="card"><h2>Daily production list</h2><div class="empty">No groups have camp dates yet. Start a group on the Groups tab.</div></section>`;return}
  if(!kitchenDate||!dates.includes(kitchenDate))kitchenDate=dates.find(x=>x>=today())||dates[dates.length-1];
  const i=dates.indexOf(kitchenDate);
  app.innerHTML=`<section class="card" aria-labelledby="h-kd">
    <div class="row between"><h2 id="h-kd">Daily production list</h2>
      <div class="row">${canPrint?`<button class="btn" data-act="kprint">Print</button>`:""}<button class="btn ${canPrint?"ghost":""}" data-act="kdownload">Download list</button></div></div>
    <div class="weeknav"><button class="btn sm quiet" data-act="kprev" ${i<=0?"disabled":""} aria-label="Previous day">←</button>
      <label class="f" style="flex-direction:row;align-items:center;gap:6px">Day <select id="kdate">${dates.map(d=>`<option value="${d}" ${d===kitchenDate?"selected":""}>${esc(fmt(d,{weekday:"short",month:"short",day:"numeric",year:"numeric"}))}</option>`).join("")}</select></label>
      <button class="btn sm quiet" data-act="knext" ${i>=dates.length-1?"disabled":""} aria-label="Next day">→</button></div>
    <p class="small muted">What the kitchen cooks and plates for the day, with a check box and PAR line for each item, the special plates, and a look at tomorrow.${canPrint?"":" Download it, open the file, and print from there."}</p>
  </section>
  <article class="sheet" id="sheet">${productionBody(kitchenDate)}</article>`;
}
function renderKitchenWeek(){
  const app=$("#app");
  if(allGroups==null){app.innerHTML=`<div class="card"><p class="muted">Loading…</p></div>`;return}
  const weeks=kitchenWeeks();
  if(!weeks.length){app.innerHTML=`<section class="card"><h2>Weekly meal schedule</h2><div class="empty">No groups have camp dates yet. Start a group on the Groups tab.</div></section>`;return}
  if(!kitchenWeek||!weeks.includes(kitchenWeek))kitchenWeek=weeks.find(w=>w>=campWeekOf(today()))||weeks[weeks.length-1];
  const i=weeks.indexOf(kitchenWeek);
  app.innerHTML=`<section class="card" aria-labelledby="h-kw">
    <div class="row between"><h2 id="h-kw">Weekly meal schedule</h2>
      <div class="row">${canPrint?`<button class="btn" data-act="kprint">Print</button>`:""}<button class="btn ${canPrint?"ghost":""}" data-act="kdownload">Download schedule</button></div></div>
    <div class="weeknav"><button class="btn sm quiet" data-act="kprev" ${i<=0?"disabled":""} aria-label="Previous week">←</button>
      <label class="f" style="flex-direction:row;align-items:center;gap:6px">Camp week <select id="kweek">${weeks.map(w=>`<option value="${w}" ${w===kitchenWeek?"selected":""}>${esc(weekLabel(w))}, ${parse(w).getFullYear()}</option>`).join("")}</select></label>
      <button class="btn sm quiet" data-act="knext" ${i>=weeks.length-1?"disabled":""} aria-label="Next week">→</button></div>
    <p class="small muted">A one-page summary of the week, then one page per day with every meal in time order.${canPrint?"":" Download it, open the file, and print from there."}</p>
  </section>
  <article class="sheet" id="sheet">${weekKitchenBody(kitchenWeek)}</article>`;
}
function kitchenAction(a){
  const wk=view==="week",list=wk?kitchenWeeks():siteDates(),cur=wk?kitchenWeek:kitchenDate,i=list.indexOf(cur);
  const set=v=>{if(wk)kitchenWeek=v;else kitchenDate=v;render()};
  if(a==="kprev"&&i>0)return set(list[i-1]);
  if(a==="knext"&&i>=0&&i<list.length-1)return set(list[i+1]);
  if(a==="kprint")return window.print();
  if(a==="kdownload"){
    if(!cur)return;
    return downloadKitchenSheet(wk?`Family Camp meal schedule ${cur}`:`Family Camp production list ${cur}`,wk?weekKitchenBody(cur):productionBody(cur),(wk?`meal-schedule-week-of-${cur}`:`production-list-${cur}`)+".html");
  }
}
$("#app").addEventListener("change",e=>{
  if(e.target.id==="kdate"){kitchenDate=e.target.value;renderKitchen()}
  if(e.target.id==="kweek"){kitchenWeek=e.target.value;renderKitchenWeek()}
});
async function downloadKitchenSheet(title,body,filename){
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>
  body{font:13px/1.45 "IBM Plex Sans",Arial,sans-serif;color:#111;margin:24px}h1,h2,h3{color:#002e5d;margin:0}table{border-collapse:collapse;width:100%;margin-top:4px}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid #ddd;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#555}.num{text-align:right}.flag{color:#c41230;font-weight:700}.miss{color:#9a5a00}.muted{color:#555}.small{font-size:12px}.sec{margin-top:18px}.gh{background:#eef2f7;padding:6px 8px;font-weight:600}
  .dpage{break-after:page;padding-bottom:18px}.dpage:last-child{break-after:auto}.top{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #002e5d;padding-bottom:8px;margin-bottom:10px}.org{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#555}.top h1{font-size:22px;margin:2px 0}.stamp{font-size:12px;font-weight:600;color:#1f7a45;text-align:right}.stamp.draft{color:#9a5a00}.stamp span{display:block;font-weight:400;color:#555}
  .dsvc{margin-top:14px;break-inside:avoid}.dsvc h2{font-size:16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #ccc;padding-bottom:3px}.dtot{font-size:13px;font-weight:600;color:#555}.ptab td.cb{width:26px}.ptab td.pc,.ptab th.pc{width:110px}
  .box{display:inline-block;width:14px;height:14px;border:1.5px solid #555;border-radius:2px;vertical-align:middle}.par{display:inline-block;width:90px;border-bottom:1px solid #555;height:16px}.k-spec td{background:#f6f8fb}.pnotes{margin-top:18px;border:1px solid #ccc;border-radius:4px;min-height:80px;padding:6px 8px;font-size:12px;color:#555}.pendnote{background:#fdf0d9;color:#9a5a00;padding:6px 10px;border-radius:4px;margin:8px 0;font-size:12px}
  .noprint{margin-bottom:16px}@media print{.noprint{display:none}body{margin:0}}
  </style></head><body><div class="noprint"><button onclick="window.print()">Print this sheet</button></div>${body}</body></html>`;
  let dl=null;try{dl=window.claude&&claude.use?await claude.use("downloads"):null}catch(e){}
  if(!dl){const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();return}toast("Downloads aren't available in this view. Open the page in claude.ai to download.");return}
  try{await dl.save({filename,data:html})}catch(e){if(e&&e.code!=="declined")toast("Couldn't download the sheet.")}
}

(async()=>{
  await store.init();
  render();
  await openFromHash();
  if(staffMode&&!location.hash){view="groups";ensureWatch();render()}
})();
